# Broker MQTT del piloto (TECH-001 §16.6, DATA-001 §3).
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
persistence false
log_dest stdout
# Los mensajes del gateway pesan decenas de bytes: el broker corta lo grande antes de que llegue a la API.
message_size_limit 4096
max_packet_size 4096
