# Demo local: `cp .env.example .env`, crear usuarios MQTT (ver README) y `docker compose up --build`.
name: modivara

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?definir en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir en .env}
      POSTGRES_DB: ${POSTGRES_DB:?definir en .env}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:?definir en .env}
      HOSPITALITY_DB_PASSWORD: ${HOSPITALITY_DB_PASSWORD:?definir en .env}
      COMMERCE_DB_PASSWORD: ${COMMERCE_DB_PASSWORD:?definir en .env}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:?definir en .env}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/init-schemas.sh:/docker-entrypoint-initdb.d/init-schemas.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  # Base desechable para `pnpm test:integration` (solo con --profile test). Mismos roles por dominio; datos en memoria.
  db-test:
    profiles: [test]
    image: postgres:18.6
    environment:
      POSTGRES_USER: modivara
      POSTGRES_PASSWORD: test
      POSTGRES_DB: modivara_test
      CORE_DB_PASSWORD: test
      HOSPITALITY_DB_PASSWORD: test
      COMMERCE_DB_PASSWORD: test
      ANALYTICS_DB_PASSWORD: test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./infra/postgres/init-schemas.sh:/docker-entrypoint-initdb.d/init-schemas.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modivara -d modivara_test"]
      interval: 2s
      retries: 30

  mqtt:
    image: eclipse-mosquitto:2.1.2-alpine
    volumes:
      - ./infra/mosquitto:/mosquitto/config

  # Cada servicio recibe solo sus variables: ni la API ve la clave del superusuario de Postgres
  # ni el simulador ve credenciales de la base.
  api:
    build: { context: ., target: api }
    environment:
      API_PORT: 3000
      MQTT_URL: mqtt://mqtt:1883
      CORE_DATABASE_URL: postgresql://core_app:${CORE_DB_PASSWORD}@db:5432/${POSTGRES_DB}?schema=core
      HOSPITALITY_DATABASE_URL: postgresql://hospitality_app:${HOSPITALITY_DB_PASSWORD}@db:5432/${POSTGRES_DB}?schema=hospitality
      COMMERCE_DATABASE_URL: postgresql://commerce_app:${COMMERCE_DB_PASSWORD}@db:5432/${POSTGRES_DB}?schema=commerce
      ANALYTICS_DATABASE_URL: postgresql://analytics_app:${ANALYTICS_DB_PASSWORD}@db:5432/${POSTGRES_DB}?schema=analytics
    depends_on:
      db: { condition: service_healthy }
      mqtt: { condition: service_started }

  web:
    build: { context: ., target: web }

  button-sim:
    build: { context: ., target: button-sim }
    environment:
      SIM_API_URL: http://api:3000/api/v1
      SIM_GATEWAY_KEY: ${SIM_GATEWAY_KEY:?definir en .env}
      SIM_TRANSPORT: ${SIM_TRANSPORT:-http}
      SIM_DEVICES: ${SIM_DEVICES:-}
      MQTT_URL: mqtt://mqtt:1883
      SIM_GATEWAY_ID: ${SIM_GATEWAY_ID:-}
      SIM_MQTT_PASSWORD: ${SIM_MQTT_PASSWORD:-}
    depends_on: [api]

  caddy:
    image: caddy:2.11.7
    ports:
      - "80:80"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [api, web, button-sim]

volumes:
  pgdata:
