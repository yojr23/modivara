# SEC-08: actualizaciones semanales; las versiones del repo son exactas (sin ^), así que llegan como PR revisables.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    target-branch: pruebas
    open-pull-requests-limit: 5
    ignore: # Node va fijo a 24 en CI, .nvmrc y Dockerfile; el salto de mayor se hace a mano en los tres a la vez.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    target-branch: pruebas
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    target-branch: pruebas
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
