# QA-01: lo mismo que se corre a mano antes de un commit. Integración contra db-test (docker compose del runner).
name: CI
on:
  pull_request:
  push:
    branches: [main, pruebas]

jobs:
  # Flujo de ramas: todo entra a `pruebas` por PR y a `main` solo llega `pruebas` (de este repo, no de un fork).
  # El ruleset de `main` exige este check. Valores por env, no interpolados en el script.
  origen:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$BASE" = main ] && { [ "$HEAD" != pruebas ] || [ "$HEAD_REPO" != "$REPO" ]; }; then
            echo "::error::A main solo se abre PR desde pruebas; abre este PR contra pruebas."
            exit 1
          fi
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5 # versión desde packageManager
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=critical # SEC-08: política: críticos bloquean el PR; altos se revisan vía Dependabot
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm check:separability
      - run: pnpm test
      - run: cp .env.example .env # compose interpola todo el archivo, también los servicios que db-test no usa
      - run: pnpm test:integration
